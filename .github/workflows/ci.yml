name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试与风格检查（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 代码风格（ruff）
        run: ruff check .

      - name: 单元测试
        run: python -m unittest discover -v

      - name: 启动服务并冒烟测试
        run: |
          DASHBOARD_HOST=127.0.0.1 DASHBOARD_PORT=8282 python3 server.py &
          sleep 2
          curl -fsS http://127.0.0.1:8282/api/overview \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ready'], d; print('overview OK, host=', d['host'])"
          curl -fsS http://127.0.0.1:8282/api/series \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'cpu' in d['series']; print('series OK')"
          curl -fsS -o /dev/null http://127.0.0.1:8282/static/app.js
          echo "静态资源 OK"
