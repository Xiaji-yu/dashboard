name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试与风格检查（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 代码风格（ruff）
        run: ruff check .

      - name: 单元测试
        run: python -m unittest discover -v

      - name: 启动服务并冒烟测试
        run: |
          DASHBOARD_HOST=127.0.0.1 DASHBOARD_PORT=8282 \
            DASHBOARD_USER=ci DASHBOARD_PASSWORD=ci-password-1 \
            DASHBOARD_AUTH_FILE=/tmp/ci-auth.json python3 server.py &
          # 等接口就绪（最多 20 秒）：固定 sleep 在慢 runner 上会偶发失败
          code=""
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -m 3 -w '%{http_code}' http://127.0.0.1:8282/api/overview || true)
            [ "$code" = "401" ] && break
            sleep 1
          done

          # 未登录应被拦下（接口 401）
          test "$code" = "401" || { echo "未登录应返回 401，实际 $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8282/)
          test "$code" = "302" || { echo "未登录访问首页应 302，实际 $code"; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:8282/login

          # 错误密码应当被拒
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"wrong"}' http://127.0.0.1:8282/api/login)
          test "$code" = "401" || { echo "错误密码应 401，实际 $code"; exit 1; }

          # 登录并带上会话 Cookie
          curl -fsS -c /tmp/ci-cookies -X POST -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password-1"}' \
            http://127.0.0.1:8282/api/login > /dev/null
          curl -fsS -b /tmp/ci-cookies http://127.0.0.1:8282/api/overview \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ready'], d; print('overview OK, host=', d['host'])"
          curl -fsS -b /tmp/ci-cookies http://127.0.0.1:8282/api/performance \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ready'], d; print('performance OK, 每核=', len(d['cpu']['per_core']['per_cpu']))"
          curl -fsS -b /tmp/ci-cookies http://127.0.0.1:8282/api/series \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'cpu' in d['series']; assert d['interval'] > 0; print('series OK')"
          curl -fsS -b /tmp/ci-cookies -o /dev/null http://127.0.0.1:8282/static/app.js
          curl -fsS -b /tmp/ci-cookies -o /dev/null http://127.0.0.1:8282/static/pages/device.js
          echo "静态资源 OK（已登录）"

  frontend:
    name: 前端图表测试（Node）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 图表库回归测试
        run: node tests/chart.test.js
